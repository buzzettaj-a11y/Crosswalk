<!-- @dsCard group="Navigation" height=100 subtitle="Two steps inside one stage, with live counts" -->
<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); color: var(--ink); }
.wrap { margin: 16px 20px; display: flex; gap: 2px; background: var(--line); border: 1px solid var(--line); }
button { flex: 1; border: none; padding: 11px 15px; text-align: left; cursor: pointer; font-family: inherit; background: var(--bg-surface); }
button span { display: block; }
.k { font-size: 10px; font-weight: 800; letter-spacing: .1em; color: var(--muted); }
.n { font-size: 13.5px; font-weight: 800; margin-top: 2px; color: var(--ink-2); }
.c { font-size: 11.5px; color: var(--muted); }
.on { background: var(--bg-card); }
.on .k { color: var(--blue-500); } .on .n { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <button class="on"><span class="k">STEP 1</span><span class="n">Decide the causes</span><span class="c">4 of 5 still to decide, covering 1,032 rows</span></button>
  <button><span class="k">STEP 2</span><span class="n">Row by row</span><span class="c">200 rows waiting</span></button>
</div>
</body>
</html>
