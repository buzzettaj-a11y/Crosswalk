<!-- @dsCard group="Navigation" height=96 width=1320 subtitle="Nine pinned stages plus Undo, four states" -->
<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); color: var(--ink); }
.strip { margin: 14px 16px; background: var(--bg-card); border: 1px solid var(--line); display: flex; align-items: stretch; }
button { flex: 1; min-width: 0; background: transparent; border: none; border-bottom: 3px solid transparent; padding: 9px 7px; text-align: left; cursor: pointer; font-family: inherit; }
button span { display: block; }
.k { font-size: 9px; font-weight: 800; letter-spacing: .1em; color: var(--muted); }
.n { font-size: 12px; font-weight: 800; color: var(--ink); margin-top: 2px; }
.c { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
.done { border-bottom-color: var(--ink); }
.empty { border-bottom-color: var(--line-2); }
.cur { background: var(--blue-100); border-bottom-color: var(--blue-500); }
.cur .k { color: var(--blue-500); } .cur .n, .cur .c { color: var(--blue-700); } .cur .c { font-weight: 600; }
.later .n { color: var(--muted); }
.undo { flex: 0 0 176px; border-left: 1px solid var(--line-soft); padding: 9px 14px; }
.undo .n { color: var(--blue-500); }
</style>
</head>
<body>
<div class="strip">
  <button class="done"><span class="k">01 SOURCES</span><span class="n">Add your files</span><span class="c">5 files, 9 tables</span></button>
  <button class="empty"><span class="k">02 SCHEMA</span><span class="n">Set up your columns</span><span class="c">nothing to decide</span></button>
  <button class="done"><span class="k">03 PREPARE</span><span class="n">Tidy up</span><span class="c">2 steps kept</span></button>
  <button class="done"><span class="k">04 MAP</span><span class="n">Match your columns</span><span class="c">45 matched, all confirmed</span></button>
  <button class="done"><span class="k">05 PROGRAMS</span><span class="n">Programs</span><span class="c">6 programs, confirmed</span></button>
  <button class="done"><span class="k">06 RUN</span><span class="n">Process</span><span class="c">done in 41 seconds</span></button>
  <button class="cur"><span class="k">07 REVIEW</span><span class="n">Fix problems</span><span class="c">1,232 rows open</span></button>
  <button class="later"><span class="k">08 SUMMARY</span><span class="n">Results</span><span class="c">14 pairs open</span></button>
  <button class="later"><span class="k">09 EXPORT</span><span class="n">Download</span><span class="c">not run yet</span></button>
  <button class="undo"><span class="k">UNDO</span><span class="n">Set aside 96 summary rows</span><span class="c">takes back one decision</span></button>
</div>
</body>
</html>
