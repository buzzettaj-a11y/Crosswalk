<!-- @dsCard group="Identity" height=110 subtitle="A letter, not a color, follows each source through the batch" -->
<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); color: var(--ink); }
.row { display: flex; align-items: center; gap: 26px; padding: 22px 20px; flex-wrap: wrap; }
.src { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 800; }
.mark { width: 16px; height: 16px; background: var(--ink); color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 800; flex-shrink: 0; }
.mark.sm { width: 14px; height: 14px; font-size: 9.5px; }
.cell { font-size: 12px; font-weight: 400; color: var(--muted); display: flex; align-items: center; gap: 7px; }
</style>
</head>
<body>
<div class="row">
  <span class="src"><span class="mark">A</span>clinic_export.csv</span>
  <span class="src"><span class="mark">B</span>legacy_export.xlsx</span>
  <span class="src"><span class="mark">C</span>state_export.xml</span>
  <span class="src"><span class="mark">D</span>partner_export.tsv</span>
  <span class="src"><span class="mark">E</span>portal_export.json</span>
  <span class="cell"><span class="mark sm">B</span>in a table cell, 14px</span>
</div>
</body>
</html>
