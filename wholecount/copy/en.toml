[map.defaults.title]
text = "Fill a field for this source only"
[map.defaults.note]
text = "Where one file leaves a field out entirely and you know the value for every row in it, set it here. It applies to this table alone, fills only blanks, and never replaces a value the file supplied. Every use is recorded in the audit log."
