# Help for stages 01 to 05 (M11). M15 builds the guide from the same keys.

[help.stage.sources.title]
text = "Add your files"
[help.stage.sources.purpose]
text = "Brings in the client lists you exported and finds the tables in them."
[help.stage.sources.how]
text = "Drop files or browse. Untick a table to leave it out. Show data lets you check the header row."
[help.stage.schema.title]
text = "Your columns"
[help.stage.schema.purpose]
text = "Sets the fields every file is matched to."
[help.stage.schema.how]
text = "The standard fields work for most work. Add a custom field with a type and a longest value."
[help.stage.prepare.title]
text = "Tidy up"
[help.stage.prepare.purpose]
text = "Adds clean columns where a file has values jammed together."
[help.stage.prepare.how]
text = "Pick a rule, then a source and its columns. A step only adds columns, and you can remove it at any time."
[help.stage.map.title]
text = "Match your columns"
[help.stage.map.purpose]
text = "Says which of your columns holds each field, table by table."
[help.stage.map.how]
text = "Check each amber callout. The blue button inside picks the column the tool found that fits better."
[help.stage.programs.title]
text = "Programs"
[help.stage.programs.purpose]
text = "Sets up the second count: clients per program."
[help.stage.programs.how]
text = "Pick each file's program column, confirm or split the proposed groups, then preview the counts."
