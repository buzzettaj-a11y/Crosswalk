# Every user-facing sentence in Wholecount's window, one table per key (H11).
#
# Each table has `text` and, for a sentence that states a fact about behavior, a `claim` ID of the form CL-<AREA>-<NN>.
# Every claim ID needs at least one test marked @pytest.mark.claim("<ID>"), and tests/copy/test_claims_have_tests.py checks it.
# Write {product} where the product name goes. Never write the name itself. Numbers are passed as int parameters and get
# thousands separators. Wording follows H16: American spelling, plain words, no em dashes, emoji or exclamation marks.

[app.version_line]
text = "{product} {version}"

[offline.nothing_leaves]
text = "Nothing leaves this computer."
claim = "CL-OFFLINE-01"

# Progress (SPEC 11.6). Step names, then the lines a running step shows.

[progress.step.reading_files]
text = "Reading files"

[progress.step.finding_tables]
text = "Finding tables"

[progress.step.tidying_up]
text = "Tidying up"

[progress.step.checking_every_row]
text = "Checking every row"

[progress.step.placing_addresses]
text = "Placing addresses"

[progress.step.finding_copies]
text = "Finding copies in each file"

[progress.step.matching_people]
text = "Matching people across files"

[progress.step.counting_and_balancing]
text = "Counting and balancing"

[progress.step.counting]
text = "Counting"

[progress.step.looking_up_addresses]
text = "Looking up addresses"

[progress.step.writing_files]
text = "Writing files"

[progress.step.reapplying_decisions]
text = "Re-applying decisions"

[progress.step.reading_corrections]
text = "Reading the corrections file"

[progress.step.checking_signatures]
text = "Checking signatures and originals"

[progress.step.drawing_pairs]
text = "Drawing pairs"

[progress.step.protecting_backup]
text = "Protecting the backup"

[progress.reading_source]
text = "Reading {source}"

[progress.finding_tables_in]
text = "Finding tables in {source}"

[progress.found.reading_files]
text = "{read} read, {unreadable} could not be read"

[progress.found.finding_tables]
text = "{tables} tables found, {included} included"

# Add your files (P-READ)

[read.encoding_note]
text = "This file was read as Windows Western text. Check that names with accents look right."
claim = "CL-READ-ENCODING-01"

[read.accounting_line]
text = "{included} rows in included tables, {excluded} in tables left out, {non_table} in blocks that aren't tables, {header} header rows and {above_header} above the header. Together they add up to the {non_empty} rows in this file that hold anything."
claim = "CL-READ-ACCOUNTING-01"

[read.accounting_line_shared]
text = "{included} rows in included tables, {excluded} in tables left out, {non_table} in blocks that aren't tables, {header} header rows and {above_header} above the header. Together they add up to the {non_empty} rows in this file that hold anything, plus {shared} rows counted once for each table that sits beside another on the same rows."
claim = "CL-READ-ACCOUNTING-02"

[read.rows_left_out]
text = "{rows} rows in this file are not in an included table, so they won't be counted. Tick their table to include them."

[read.unreadable.unsupported_type]
text = "This kind of file can't be read. Save it as .csv, .tsv, .txt, .xlsx, .json or .xml and add it again."

[read.unreadable.unreadable_encoding]
text = "This file's text isn't UTF-8 or Windows Western text, so it can't be read without guessing. Save it from Excel as CSV UTF-8 and add it again."

[read.unreadable.bad_workbook]
text = "This workbook can't be opened. It may be damaged or saved in an older format. Open it in Excel, save it as .xlsx and add it again."

[read.unreadable.bad_json]
text = "This JSON file isn't valid JSON, so it can't be read."

[read.unreadable.bad_xml]
text = "This XML file isn't valid XML, so it can't be read."

[read.unreadable.empty_file]
text = "This file is empty."

[read.unreadable.blocked_by_guard]
text = "This file is on a network path that {product} doesn't open. Copy it to this computer and add it again."

[read.duplicate_file]
text = "This file was already added. The second copy was skipped."

[read.sensitive_dropped]
text = "Dropped at load: {columns} columns whose names or values suggest sensitive data."

[progress.file_count]
text = "{done} of {total} files"

# Match your columns (P-MAP). These sentences state computed facts about the data, so they take no claim ID.

[mapping.check.col_ok]
text = "Looks right."

[mapping.check.col_empty_ok]
text = "Always empty in this file, which is fine for this field."

[mapping.check.col_empty]
text = "This column is empty on every row, so this field will be blank throughout."

[mapping.check.col_mostly_empty]
text = "Only about {percent}% of rows have a value here. The rest would be missing this field."

[mapping.check.col_low_fill]
text = "Only about {percent}% of rows have a value here."

[mapping.check.col_address1_dates]
text = "These are dates, not street addresses."

[mapping.check.col_address1_not_streets]
text = "These don't look like street addresses. A street is a house number followed by a street name."

[mapping.check.col_address1_mostly_units]
text = "These look like apartment or floor numbers rather than streets. This column probably belongs in Address 2."

[mapping.check.col_address1_digits_only]
text = "These are only numbers, with no street name. An address needs both."

[mapping.check.col_address1_no_house_number]
text = "Most of these have no house number, so they may not be placed on the map."

[mapping.check.col_zip_lost_zero]
text = "Most of these are four digits. A ZIP has five, so these have probably lost a leading zero."

[mapping.check.col_zip_not_zips]
text = "These don't look like ZIP codes. A ZIP is five digits."

[mapping.check.col_state_not_two_letters]
text = "A state should be two letters, such as NY."

[mapping.check.col_city_has_digits]
text = "Cities shouldn't contain numbers. This column may hold addresses rather than city names."

[mapping.check.col_city_many_values]
text = "There are {distinct} different values here, and few are boroughs. Check that this is a city column."

[mapping.check.col_name_looks_like_address]
text = "These look like addresses rather than names. The columns may be matched one across."

[mapping.check.col_name_has_digits]
text = "Names shouldn't contain numbers."

[mapping.check.col_name_mostly_one_value]
text = "About {percent}% of rows have the same value here, which a name column rarely does."

[mapping.check.col_middle_full_names]
text = "These are full middle names. Only the first letter is kept, so check that's what you want."

[mapping.check.col_id_repeats]
text = "Most rows share an identifier, so it can't tell people apart. The most common one appears {times} times."

[mapping.check.col_program_looks_like_dates]
text = "These are dates, not program names. The count by program needs names."

[mapping.check.col_program_looks_like_codes]
text = "These are numbers, which look like program codes rather than names. The count by program needs names."

[mapping.check.col_address2_mostly_streets]
text = "These look like streets, not apartment or floor numbers. Check whether this column belongs in Address 1."

[mapping.check.col_address2_not_units]
text = "These don't look like apartment or floor numbers. Check what this column holds."

[mapping.better_column]
text = "The column {column} looks like it holds this field. Choose it instead."

[mapping.question_tie]
text = "Two or more columns fit {field} equally well. Choose one."

[map.block.missing_required]
text = "{field} has no column in this table, so the table can't be processed yet."

[map.block.missing_client_id_or_dob]
text = "This table has no Client ID column and no Date of Birth column. Map one of them so its rows can be counted."

[map.block.ssn_shaped_id]
text = "These identifiers look like Social Security numbers. Map a different identifier, or drop this column."

[map.custom_required_no_column]
text = "{field} is required but has no column in this table. Each row will be listed for a check."

[map.date_order_question]
text = "This table writes dates as month/day or day/month? {month_first} values can only be month/day, {day_first} can only be day/month, and {either} could be either."

[map.date_both_ways]
text = "Dates in this column are written both ways."

[map.two_digit_rule_question]
text = "Two-digit years up to {pivot} mean the 2000s, otherwise the 1900s."

# Tidy up (P-PREP). Step rows that changed nothing are amber and say what they failed to find.

[tidy.amber.clean_changed_nothing]
text = "This step changed nothing. Every value was already clean."

[tidy.amber.split_found_no_delimiter]
text = "No row holds this delimiter, so nothing was split."

[tidy.amber.split_found_nothing]
text = "This step found nothing to split in this column."

[tidy.amber.no_lookup_available]
text = "No address lookup is available, so no ZIP could be calculated. Add Geosupport or the address reference to use this step."

[set_aside.summary_row]
text = "This row is a total or a heading, not a person, so it was set aside."

[progress.rows_checked]
text = "{done} of {total} rows checked"

[progress.found.checking_rows]
text = "{counted} of {rows} rows counted"

# Placing addresses (P-GEO, SPEC 7.4). The engine returns a code; each code has one sentence here.

[geo.reason.matched_building]
text = "Geosupport or the reference matched the building exactly."
claim = "CL-GEO-REASON-01"

[geo.reason.matched_with_warning]
text = "Geosupport matched the address with a warning, so this is low confidence."
claim = "CL-GEO-REASON-02"

[geo.reason.house_out_of_range]
text = "Geosupport found the street, but the house number is outside its known range, so this is low confidence."
claim = "CL-GEO-REASON-03"

[geo.reason.matched_street_only]
text = "Only the street matched, not the building, so this is low confidence."
claim = "CL-GEO-REASON-04"

[geo.reason.not_found]
text = "No exact match was found for this address, so it wasn't placed."
claim = "CL-GEO-REASON-05"

[geo.reason.reference_ambiguous]
text = "The reference holds two different points for this address, so it wasn't placed."
claim = "CL-GEO-REASON-06"

[geo.reason.no_backend]
text = "No geocoder is set up, so this address wasn't looked up."
claim = "CL-GEO-REASON-07"

[location.mapped_high]
text = "Mapped, high confidence"
claim = "CL-GEO-HIGH-01"

[location.mapped_low]
text = "Mapped, low confidence"
claim = "CL-GEO-HIGH-02"

[location.verified]
text = "Verified"
claim = "CL-GEO-HIGH-03"

[location.not_mapped.no_fixed_address]
text = "Counted, not mapped: no fixed address."

[location.not_mapped.outside_nyc]
text = "Counted, not mapped: outside NYC."

[location.not_mapped.address_problem]
text = "Counted, not mapped: the address has a problem to fix."

[location.not_mapped.not_found]
text = "Counted, not mapped: the address wasn't found."
claim = "CL-GEO-LOC-01"

[location.not_mapped.no_geocoder]
text = "Counted, not mapped: no geocoder."
claim = "CL-GEO-LOC-02"

[geo.moved_point_note]
text = "Each point is moved 150 to 250 feet from the building, so a point can sit across a district line from its district. Districts come from the true location."
claim = "CL-GEO-OFFSET-01"

[geo.preflight.sample_refused]
text = "The file in the reference folder is the practice sample. It can only be used with the example data, so these addresses won't be placed."
claim = "CL-GEO-PRE-01"

[geo.preflight.several_reference_files]
text = "The reference folder holds more than one file. Leave only one there so the results don't depend on which one is picked."
claim = "CL-GEO-PRE-02"

[geo.preflight.no_geocoder]
text = "Neither Geosupport nor an address reference is set up, so addresses won't be placed. Every counted row will read Counted, not mapped: no geocoder."
claim = "CL-GEO-PRE-03"

[geo.preflight.release_stale]
text = "Geosupport release {release} is more than a year old. District lines may have changed since then."
claim = "CL-GEO-PRE-04"

[geo.preflight.no_district_files]
text = "No district files are installed, so addresses placed by the reference get no districts."
claim = "CL-GEO-PRE-05"

[geo.preflight.release_line]
text = "Geosupport release {release}"

[geo.preflight.reference_line]
text = "Address reference with {rows} addresses"

[geo.fill.evidence.reference]
text = "In the reference I have, the file you added with {rows} addresses, {house} {street} in {came_from} is in {value}."
claim = "CL-GEO-FILL-01"

[geo.fill.evidence.geosupport]
text = "Geosupport {release} matched {house} {street} in {came_from}, which is in {value}."
claim = "CL-GEO-FILL-02"

[geo.fill.nothing_changes]
text = "Nothing changes until you accept it."
claim = "CL-GEO-FILL-03"

[audit.geo.privacy_offset_applied]
text = "Privacy offset applied to map points."
claim = "CL-GEO-OFFSET-02"

[map.fewer_than]
text = "fewer than {limit}"
claim = "CL-GEO-MAP-01"

[progress.addresses_looked_up]
text = "{done} of {total} addresses looked up"

[progress.found.placing_addresses]
text = "{placed} of {looked_up} addresses placed"
